set -g default-shell /usr/bin/zsh
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-kitty:RGB'
set -g mouse on
set -g history-limit 50000
set -g set-titles on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g status-position bottom
set -g status-interval 15
set -g status-style 'bg=#211e30,fg=#f1e5db'
set -g status-left-length 32
set -g status-left '#[bg=#efbc99,fg=#211e30,bold] #S #[default] '
set -g status-right-length 48
set -g status-right '#[fg=#c79fcb]#{b:pane_current_path}  #[bg=#393247,fg=#f1e5db] %H:%M '
setw -g window-status-format '#[fg=#b9acc2] #I #W '
setw -g window-status-current-format '#[bg=#4a405b,fg=#efbc99,bold] #I #W '
set -g pane-border-style 'fg=#4a405b'
set -g pane-active-border-style 'fg=#efbc99'
set -g message-style 'bg=#efbc99,fg=#211e30'
set -g mode-style 'bg=#68516b,fg=#f1e5db'

bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind r source-file ~/.config/tmux/tmux.conf
