general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = @WALLPAPER@
    color = rgb(151825)
    blur_passes = 1
    blur_size = 3
    brightness = 0.69
}

label {
    monitor =
    text = cmd[update:1000] date '+%H<span foreground="tomato">:</span>%M'
    color = rgb(f7f4ff)
    font_family = Adwaita Sans Bold
    font_size = 80
    position = 0, 166
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] date '+%Y-%m-%d  %A'
    color = rgb(ebe7ff)
    font_family = Adwaita Sans
    font_size = 17
    position = 0, 99
    halign = center
    valign = center
    zindex = 2
}

image {
    monitor =
    path = @AVATAR@
    size = 72
    rounding = -1
    border_size = 2
    border_color = rgba(227, 220, 250, 0.66)
    position = 0, -39
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = $USER
    color = rgb(f7f4ff)
    font_family = Adwaita Sans Bold
    font_size = 17
    position = 0, -95
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 245, 46
    outline_thickness = 1
    rounding = 23
    dots_size = 0.22
    dots_center = true
    fade_on_empty = false
    placeholder_text = @PLACEHOLDER@
    fail_text = @FAIL@
    outer_color = rgba(230, 222, 248, 0.49)
    inner_color = rgba(19, 21, 34, 0.56)
    font_color = rgb(f7f4ff)
    check_color = rgb(c9bafa)
    fail_color = rgb(f59dad)
    capslock_color = rgb(f6ce99)
    position = 0, -149
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1500] @NOTIFICATIONS@
    color = rgb(e8defa)
    font_family = Adwaita Sans
    font_size = 12
    position = 0, -196
    halign = center
    valign = center
    zindex = 2
}
